name: CI

# 持续集成: 后端全量测试 + 前端构建。
# 与 release.yml 的分工: 这里不打包, 只守质量门 —
# 后端含 Tier A 开放契约快照测试 (test_openapi_contract.py),
# 开放面的任何变化都会在这里被拦下, 须有意识地更新快照。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tivelo-packages:
    name: Independent engines (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      UV_MANAGED_PYTHON: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-26, python: '3.12'}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install managed Python
        run: uv python install ${{ matrix.python }}
      - name: Build contract and engines
        run: |
          uv build packages/tivelo-contracts --out-dir dist/tivelo-contracts
          uv build packages/tivelo-data --out-dir dist/tivelo-data
          uv build packages/tivelo-backtest --out-dir dist/tivelo-backtest
      - name: Verify data engine independently
        run: >-
          uv run --no-project --python ${{ matrix.python }} python scripts/verify_tivelo_distribution.py
          --package packages/tivelo-data --dist dist/tivelo-data
          --with-wheel dist/tivelo-contracts --python ${{ matrix.python }}
      - name: Verify backtest engine independently
        run: >-
          uv run --no-project --python ${{ matrix.python }} python scripts/verify_tivelo_distribution.py
          --package packages/tivelo-backtest --dist dist/tivelo-backtest
          --with-wheel dist/tivelo-contracts --python ${{ matrix.python }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 设置 Python
        run: uv python install 3.12

      - name: 安装依赖 (含 dev 测试链)
        run: uv sync --extra dev --frozen

      - name: 后端全量测试
        run: uv run pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 前端测试
        run: pnpm exec vitest run

      - name: 构建 (tsc + vite)
        run: pnpm build

  windows-mining-lock:
    name: Windows mining lock recovery
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: 设置 Python
        run: uv python install 3.12
      - name: 安装依赖
        run: uv sync --extra dev --frozen
      - name: 原生 Windows 锁、进程、接管和桌面启动回归
        run: >-
          uv run pytest tests/test_mining_process_lock.py
          tests/test_mining_lock_admin.py tests/test_mining_lock_http.py
          tests/test_main_mining_lifespan.py
          tests/test_desktop_startup.py tests/test_spa_static_routes.py
          tests/test_data_dir_upgrade.py tests/test_macos_data_dir.py
          tests/test_windows_installer_contract.py tests/test_docker_data_dir.py
          tests/test_enriched_generation.py -q
