name: Specification compliance

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pyyaml pytest
      - run: python scripts/check_spec_compliance.py
      - run: python -m pytest tests/spec_contracts/test_spec_guard_contract.py -q
