name: 桌面客户端发布

# 触发方式: 手动 (workflow_dispatch)。
# 在 GitHub Actions 页面点 "Run workflow", 选择要构建的平台 + 版本号,
# 构建完成后自动创建/更新 Release 并上传安装包。
#
# 为什么不用 tag 自动触发:
#   - 多平台并行构建, mac/linux 未就绪时会自动失败污染 Release
#   - 手动触发可精确控制 "今天只发 Windows, 明天补 mac"
#   - 版本号通过 input 传入, 与 tag 解耦, 更灵活
#
# 使用:
#   gh workflow run release.yml -f version=v0.2.0 -f platforms=windows
#   或 GitHub 网页 Actions → 桌面客户端发布 → Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v0.1.33, 用作 Release tag 和标题; 必须与 frontend/package.json 的 version 一致, 否则流水线直接失败)'
        required: true
        default: 'v0.4.1'
      platforms:
        description: '要构建的平台 (逗号分隔: windows,macos,linux)'
        required: true
        default: 'windows'
      verify_only:
        description: '仅构建和验证，不创建或更新 Release'
        type: boolean
        default: false
      upgrade_from:
        description: 'Windows 仅验证模式下用于覆盖安装验收的旧版本 (如 v0.3.37)'
        type: string
        default: ''
      prerelease:
        description: '是否为预发布 (勾选则标记为 Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  # 第一步: 过滤出本次要构建的平台
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      ver: ${{ steps.filter.outputs.ver }}
    steps:
      - name: 检出代码
        # 仅为校验版本一致性 (读 frontend/package.json), 浅检出足够
        uses: actions/checkout@v4

      - id: filter
        run: |
          # 版本号唯一权威 = frontend/package.json (安装包、页面显示、更新检查同源)。
          # 发版输入与它不一致直接失败, 防止 tag/安装包/页面三处版本漂移。
          PKG_VER=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          REQ_VER='${{ github.event.inputs.version }}'
          if [ "v$PKG_VER" != "$REQ_VER" ]; then
            echo "::error::版本不一致: 发版输入 $REQ_VER, frontend/package.json 为 v$PKG_VER。请以 frontend/package.json 为准, 统一版本号后再发版。"
            exit 1
          fi

          REQUESTED="${{ github.event.inputs.platforms }}"
          # macOS 仅构建 ARM64 (Apple Silicon), 不构建 Intel:
          #   1) GitHub 最后一个原生 Intel runner (macos-13) 已于 2025-12-04 退役;
          #   2) 项目依赖 polars, 而 polars 自 1.33 起移除了 macOS x86_64 原生 wheel
          #      (改 py3-none-any), 在 arm64 runner 上经 Rosetta 无法产出可运行的 x64 包。
          #   runner 用 macos-26 (2026-02 GA, 免费, arm64 原生, SDK 更新)。
          ALL='[{"os":"windows-latest","artifact":"TSP-Setup-x64.exe","platform":"windows"},{"os":"macos-26","artifact":"TSP-macos-arm64.dmg","platform":"macos","arch":"arm64"},{"os":"ubuntu-24.04","artifact":"TSP-linux-x64.tar.gz","platform":"linux"}]'
          # 按 input 过滤平台 (macos → arm64 单项)
          python3 -c "
          import json, sys
          requested = '${{ github.event.inputs.platforms }}'.split(',')
          requested = [r.strip() for r in requested if r.strip()]
          ver = '${{ github.event.inputs.version }}'.lstrip('v')  # v0.3.3 → 0.3.3
          all_platforms = json.loads('''$ALL''')
          selected = [p for p in all_platforms if p['platform'] in requested]
          # 产物文件名带版本号 (TSP-Setup-x64-0.3.3.exe): 用户下载后一眼可辨版本。
          # 按已知后缀插入版本号 — 不能用 rpartition('.') 拆扩展名:
          # "TSP-linux-x64.tar.gz" 会拆成 stem=".tar" + ext="gz", 拼出
          # "TSP-linux-x64.tar-0.3.9.gz", 与 latest.json 清单的通配格式不符。
          for p in selected:
              name = p['artifact']
              for suffix in ('.tar.gz', '.dmg', '.exe'):
                  if name.endswith(suffix):
                      p['artifact'] = f'{name[:-len(suffix)]}-{ver}{suffix}'
                      break
              else:
                  raise SystemExit(f'未知产物后缀: {name}')
          print('matrix=' + json.dumps({'include': selected}))
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write('matrix=' + json.dumps({'include': selected}) + '\n')
              f.write('ver=' + ver + '\n')
          "

      - uses: astral-sh/setup-uv@v3
      - name: 构建五份公开引擎 wheel
        run: |
          for package in tivelo-contracts tivelo-data tivelo-market-cn tivelo-backtest tivelo-extensions; do
            uv build --wheel --out-dir dist/tivelo-public-wheels "packages/$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tivelo-public-wheels
          path: dist/tivelo-public-wheels/*.whl
          if-no-files-found: error

  # 第二步: 各平台并行构建
  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 单平台失败不影响其他平台
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # issue #513: 构建产物内的 VERSION / pyproject / _FALLBACK_VERSION 从
      # frontend/package.json 派生, 防止发版只改 package.json 时版本漂移。
      - name: 同步版本号 (从 frontend/package.json 派生)
        run: python3 scripts/sync_versions.py

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 构建前端
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 设置 Python
        run: uv python install 3.12

      - name: 安装后端依赖 (含 desktop + legacy-cpu)
        working-directory: backend
        # --no-dev 排除 pytest/ruff/mypy; --extra desktop 装 pywebview
        # --extra legacy-cpu 装 polars[rtcompat] 运行时兼容内核:
        #   让安装包同时兼容 AVX2 新 CPU 和无 AVX2 的老 CPU (NAS/老服务器/国产 CPU)。
        #   rtcompat 会在运行时自动探测 CPU 能力 —— 有 AVX2 用 AVX2, 没有则回退,
        #   对新 CPU 性能几乎无损 (Polars 1.x 官方推荐方案)。
        run: uv sync --frozen --no-editable --no-dev --extra desktop --extra legacy-cpu --python 3.12

      - name: 安装 PyInstaller
        # 必须装进 backend 的 uv 环境 (pywebview/polars 等依赖都在那里),
        # 否则根目录 uv run 找不到依赖, 打包出来的产物启动即崩。
        # 注意: 不用 `uv pip install --project backend` —— 在 macos runner 上
        # --project 的 venv 自动发现不可靠 (报 "No virtual environment found")。
        # 用 working-directory 进 backend 目录, 与上面 uv sync 的环境一致。
        working-directory: backend
        run: uv pip install "pyinstaller==6.22.3"

      - uses: actions/download-artifact@v4
        with:
          name: tivelo-public-wheels
          path: ${{ runner.temp }}/tivelo-public-wheels
      - name: 安装发布用的公开引擎包
        working-directory: backend
        env:
          WHEELHOUSE: ${{ runner.temp }}/tivelo-public-wheels
        run: >-
          uv run --no-sync python -c
          "import os, pathlib, subprocess, sys; wheels = sorted(pathlib.Path(os.environ['WHEELHOUSE']).glob('*.whl'));
          assert len(wheels) == 5; subprocess.run(['uv', 'pip', 'install', '--python', sys.executable, '--no-deps', '--reinstall', *map(str, wheels)], check=True)"

      - name: 安装 GTK 和 WebKit (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth xdotool

      - name: 打包 (PyInstaller)
        # 在 backend 目录跑 (用该目录的 venv: pywebview/polars 等依赖)。
        # 产物输出到 backend/dist/ (PyInstaller 默认路径), 与 packaging/tsp.iss
        # 的 Source 路径 (..\backend\dist\TSP\*) 保持一致。
        # SPECPATH 由 spec 文件位置决定 (packaging/tsp.spec → 项目根),
        # 与 cwd 无关, 故 frontend/dist、tiers.yaml 等相对路径仍正确。
        working-directory: backend
        env:
          TIVELO_DESKTOP_WHEELHOUSE: ${{ runner.temp }}/tivelo-public-wheels
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            # 只提供 GTK 的 Python 绑定，避免 PyInstaller 收进 Ubuntu 的 pkg_resources 等模块。
            gtk_bindings="$RUNNER_TEMP/tsp-gtk-bindings"
            mkdir -p "$gtk_bindings"
            gtk_system=/usr/lib/python3/dist-packages
            # PyInstaller 的 GI hook 读取 PyGObject 发行包版本来选择隐藏导入。
            ln -s "$gtk_system/gi" "$gtk_system/cairo" "$gtk_system"/PyGObject-*.egg-info "$gtk_bindings/"
            export PYTHONPATH="$gtk_bindings"
            uv run --no-sync python -c 'from importlib.metadata import version; from webview.platforms import gtk; print(version("PyGObject"), gtk.webkit_ver)'
          fi
          uv run --no-sync pyinstaller ../packaging/tsp.spec --noconfirm

      - name: 校验策略提示词并生成升级保护清单
        # 清单以实际交付的程序目录为基准，macOS 的可定制文件位于 .app/Contents/Resources。
        # uv run --no-project: 跨平台用 uv 管的 Python; 版本号唯一权威 =
        # frontend/package.json (与 app/__init__._load_version 同源)。
        # shell: bash —— Windows runner 默认是 pwsh, 不认识 FOO=$(...) 语法;
        # 三平台 runner 均自带 bash, 显式指定即可统一。
        shell: bash
        run: |
          package_root=backend/dist/TSP/_internal
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            package_root=backend/dist/TSP.app/Contents/Resources
          fi
          uv run --no-project python - "$package_root" <<'PY'
          import sys
          from pathlib import Path

          source = Path("backend/app/strategy/prompts")
          packaged = Path(sys.argv[1]) / "app/strategy/prompts"
          if not (source / "strategy-guide-compact.md").is_file():
              raise SystemExit("Missing strategy generation guide")
          for prompt in source.glob("*.md"):
              target = packaged / prompt.name
              if not target.is_file() or target.read_bytes() != prompt.read_bytes():
                  raise SystemExit(f"Missing or mismatched strategy prompt: {target}")
          print("Strategy prompt packaging check passed")
          PY
          APP_VER=$(node -p "require('./frontend/package.json').version")
          uv run --no-project python scripts/generate_manifest.py --root "$package_root" --output "$package_root/app/upgrade_manifest.json" --version "$APP_VER"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # 清单加入后重签外层 .app，嵌套二进制沿用 PyInstaller 的签名。
            codesign --force --sign - backend/dist/TSP.app
            codesign --verify --deep --strict backend/dist/TSP.app
          fi

      - name: 检查 Polars 兼容内核 (仅 Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $runtimeRoot = 'backend/dist/TSP/_internal'
          $required = @(
            '_polars_runtime_32/_polars_runtime.pyd',
            '_polars_runtime_compat/_polars_runtime.pyd'
          )
          $missing = $required | Where-Object {
            -not (Test-Path (Join-Path $runtimeRoot $_))
          }
          if ($missing) {
            throw "PyInstaller output is missing Polars runtime(s): $($missing -join ', ')"
          }

      - name: 安装 Inno Setup (仅 Windows)
        if: matrix.platform == 'windows'
        # Inno Setup 6: 把 PyInstaller 产出封装成单文件安装包
        run: choco install innosetup -y --no-progress

      - name: 生成 Windows 安装包 (Inno Setup)
        if: matrix.platform == 'windows'
        # 从 frontend/package.json 读版本号传给 ISCC, 保持与 Release tag 一致
        run: |
          $ver = (Get-Content frontend/package.json | ConvertFrom-Json).version
          echo "版本号: $ver"
          ISCC.exe "/DMyAppVersion=$ver" packaging/tsp.iss
          # 把生成的 Setup.exe 移到工作区根 (Release 上传用)
          Move-Item packaging/Output/TSP-Setup-$ver.exe ${{ matrix.artifact }} -Force
        shell: pwsh

      - name: 生成 DMG (macOS)
        if: matrix.platform == 'macos'
        # 用 create-dmg 生成标准 macOS DMG:
        # 挂载后显示一个带背景的卷, 左侧 app 图标, 右侧 Applications 替身,
        # 用户直接把图标拖进 Applications 即完成安装 (符合 mac 习惯)。
        # --app-drop-link 在指定坐标生成 Applications 替身 (即"拖拽安装"箭头的目标);
        # --skip-jenkins 跳过 Finder 排图标动画 (CI 无 GUI, 否则 AppleScript 卡住)。
        # 工作目录是项目根 (与 Windows/Linux 步骤一致), 产物输出到根。
        # create-dmg 语法: create-dmg [选项] <输出.dmg> <源目录或.app>
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Tick Stock Panel" \
            --volicon "brand/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "TSP.app" 175 190 \
            --app-drop-link 425 190 \
            --hide-extension "TSP.app" \
            --skip-jenkins \
            --no-internet-enable \
            "${{ matrix.artifact }}" \
            backend/dist/TSP.app

      - name: 压缩产物 (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd backend/dist
          tar -czf ../../${{ matrix.artifact }} TSP

      - name: 验证安装包中的引擎
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          DESKTOP_ARTIFACT: ${{ matrix.artifact }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.ver }}
          WINDOWS_UPGRADE_FROM: ${{ inputs.verify_only && inputs.upgrade_from || '' }}
        run: |
          set -euo pipefail
          verification=$(mktemp -d)
          case "$TARGET_PLATFORM" in
            macos)
              volume="$verification/volume"
              mkdir "$volume"
              hdiutil attach -nobrowse -readonly -mountpoint "$volume" "$DESKTOP_ARTIFACT"
              trap 'hdiutil detach "$volume"' EXIT
              cmp brand/icon.icns "$volume/.VolumeIcon.icns"
              cmp brand/icon.icns "$volume/TSP.app/Contents/Resources/icon.icns"
              ditto "$volume/TSP.app" "$verification/TSP.app"
              hdiutil detach "$volume"
              trap - EXIT
              test -s "$verification/TSP.app/Contents/Resources/app/upgrade_manifest.json"
              codesign --verify --deep --strict "$verification/TSP.app"
              executable="$verification/TSP.app/Contents/MacOS/TSP" ;;
            windows)
              executable="$verification/installed/TSP.exe" ;;
            linux)
              tar -C "$verification" -xzf "$DESKTOP_ARTIFACT"
              executable="$verification/TSP/TSP" ;;
          esac
          data_dir="$verification/data"
          report="$verification/engine-status.json"
          env_file="$verification/empty.env"
          if [[ "$TARGET_PLATFORM" == "windows" ]]; then
            executable=$(cygpath -w "$executable")
            data_dir=$(cygpath -w "$data_dir")
            report=$(cygpath -w "$report")
            env_file=$(cygpath -w "$env_file")
          fi
          DATA_DIR="$data_dir" TICKFLOW_ENV_FILE="$env_file" NUMBA_NUM_THREADS=4 \
            uv run --no-project --python 3.12 python - "$executable" "$report" <<'PY'
          import hashlib, json, os, re, shutil, subprocess, sys
          from pathlib import Path
          from urllib.request import urlopen

          def install(artifact, directory=None):
              options = ["/VERYSILENT", "/SUPPRESSMSGBOXES", "/SP-", "/NORESTART", "/NOICONS"]
              if directory is not None:
                  options.append(f"/DIR={directory}")
              subprocess.run([artifact, *options], check=True, timeout=240)

          def installed_version(directory):
              manifest = directory / "_internal/app/upgrade_manifest.json"
              return json.loads(manifest.read_text(encoding="utf-8"))["version"]

          executable, report = map(Path, sys.argv[1:])
          desktop_version = os.environ["DESKTOP_VERSION"]
          protected = {}
          if os.environ["TARGET_PLATFORM"] == "windows":
              destination = executable.parent
              previous_tag = os.environ["WINDOWS_UPGRADE_FROM"]
              installer = Path(os.environ["DESKTOP_ARTIFACT"]).resolve()
              if previous_tag:
                  if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", previous_tag):
                      raise SystemExit("upgrade_from must be a version tag such as v0.3.37")
                  previous_version = previous_tag[1:]
                  if tuple(map(int, previous_version.split("."))) >= tuple(map(int, desktop_version.split("."))):
                      raise SystemExit("upgrade_from must be older than the candidate")
                  repo = os.environ["GITHUB_REPOSITORY"]
                  url = f"https://github.com/{repo}/releases/download/{previous_tag}"
                  old_name = f"TSP-Setup-x64-{previous_version}.exe"
                  with urlopen(f"{url}/latest.json", timeout=60) as source:
                      published = json.load(source)
                  asset = published["channels"]["windows"]
                  assert published["tag"] == previous_tag and asset["name"] == old_name
                  old_installer = report.parent / old_name
                  with urlopen(f"{url}/{old_name}", timeout=60) as source, old_installer.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  with old_installer.open("rb") as source:
                      sha = hashlib.file_digest(source, "sha256").hexdigest()
                  assert old_installer.stat().st_size == asset["size"] and sha == asset["sha256"], "Old installer checksum mismatch"
                  install(old_installer, destination)
                  assert installed_version(destination) == previous_version

                  data = destination / "data"
                  protected = {
                      data / "user_data/preferences.json": b'{"onboarding_completed":true,"nav_hidden":["/watchlist"]}',
                      data / "strategies/custom/trend_breakout.py": Path("backend/app/strategy/seeds/trend_breakout.py").read_bytes(),
                  }
                  for path, content in protected.items():
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(content)

                  # 让 Inno 按已安装版本的记录选择目录；启动也用原安装目录中的 data。
                  install(installer)
                  os.environ.pop("DATA_DIR", None)
              else:
                  install(installer, destination)
              assert installed_version(destination) == desktop_version

          subprocess.run([executable, "--engine", "--report", report, "status"], check=True, timeout=120)
          status = json.loads(report.read_text(encoding="utf-8"))
          assert status["compatibility_lock"]["workbench"] == desktop_version
          assert {wheel["name"] for wheel in status["engines"]} == {"tivelo-data", "tivelo-backtest"}

          report = report.with_name("engine-check.json")
          subprocess.run([executable, "--engine", "--report", report, "check"], check=True, timeout=240)
          result = json.loads(report.read_text(encoding="utf-8"))
          assert set(result["prices"]) == {"qfq", "hfq"}
          assert all(price["filled_orders"] > 0 for price in result["prices"].values())
          assert "daily.report" in result["workbench"]["stages"]
          print("Packaged data engine, both free price views and the workbench run passed")
          if protected:
              assert (executable.parent / "data/tivelo-desktop/combinations.sqlite3").is_file()
              assert all(path.read_bytes() == content for path, content in protected.items()), "Installed upgrade changed legacy data"
              print("Windows installer reused the old installation and preserved legacy data")
          PY

          if [[ "$TARGET_PLATFORM" == "linux" ]]; then
            DATA_DIR="$verification/window-data" TICKFLOW_ENV_FILE="$env_file" \
              xvfb-run -a bash -e -c '
                "$1" &
                desktop_pid=$!
                close_desktop() {
                  kill "$desktop_pid" 2>/dev/null || true
                  wait "$desktop_pid" 2>/dev/null || true
                }
                trap close_desktop EXIT
                timeout 75 xdotool search --sync --onlyvisible --name "^TSP$"
                kill -0 "$desktop_pid"
              ' desktop-window-check "$executable"
          fi

      - name: 上传产物为构建产物 (备查)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: 上传到 GitHub Release
        if: ${{ !inputs.verify_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: ${{ matrix.artifact }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true   # 自动从 commit 生成 changelog
          body: |
            ## 桌面客户端 ${{ github.event.inputs.version }}

            ### ⬇️ 下载

            | 平台 | 文件 | 下载 |
            | :--- | :--- | :--- |
            | **Windows x64** | `TSP-Setup-x64-${{ needs.prepare.outputs.ver }}.exe` | [⬇️ 立即下载](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/TSP-Setup-x64-${{ needs.prepare.outputs.ver }}.exe) |
            | **macOS (Apple Silicon / M 系列芯片)** | `TSP-macos-arm64-${{ needs.prepare.outputs.ver }}.dmg` | [⬇️ 立即下载](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/TSP-macos-arm64-${{ needs.prepare.outputs.ver }}.dmg) |
            | **Linux** | `TSP-linux-x64-${{ needs.prepare.outputs.ver }}.tar.gz` | [⬇️ 立即下载](https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/TSP-linux-x64-${{ needs.prepare.outputs.ver }}.tar.gz) |

            > 💡 点击「立即下载」直接获取, 无需滚动到底部附件区。
            > 🍎 **macOS 仅提供 Apple Silicon (M 系列芯片) 版本**: 点左上角  → "关于本机", 看"芯片"一项是否为 Apple; Intel 芯片 Mac 暂不支持 (上游 polars 已停止发布 Intel wheel)。

            ### 📋 使用说明
            - **Windows**: 下载后双击运行, 按安装向导操作(无需管理员权限), 自动创建桌面/开始菜单快捷方式
            - **macOS**: 双击 dmg 打开, 将 TSP 拖入 Applications 文件夹; 首次启动需右键→打开(绕过 Gatekeeper)
            - **Linux**: Ubuntu 24.04 x64 桌面环境需安装 `gir1.2-gtk-3.0` 和 `gir1.2-webkit2-4.1`，解压后运行 `TSP`
            - 数据存储: Windows 在安装目录的 `data/` 子文件夹 (卸载重装不丢); macOS 在 `~/Library/Application Support/TSP` (替换 App 升级不丢)
            - 内置 Polars 兼容内核, 新老 CPU (无 AVX2) 均可运行
            - 内置 Tivelo 回测引擎，支持策略回测和信号回测
            - 系统通知: 设置 → 实时监控 → 系统通知
            - 检查更新: 设置 → 系统设置 → 关于

  # 第三步: 生成 latest.json 更新清单 (客户端「检查更新」的稳定契约)
  manifest:
    needs: build
    # fail-fast: false 时部分平台失败会让 build 整体标红, 但已成功的平台资产
    # 依然有效 — 清单照样生成 (以 Release 上实际存在的资产为准, 天然支持
    # "今天发 Windows, 明天补 mac" 的分批发布: 每次按当前 Release 全量重建)。
    if: ${{ !inputs.verify_only && !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: 生成并上传 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          # 只拉已知的三个安装包 (latest.json 自身等其他资产不进清单);
          # 产物文件名带版本号, 故用通配匹配当前版本
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'TSP-Setup-x64-*.exe' \
            --pattern 'TSP-macos-arm64-*.dmg' \
            --pattern 'TSP-linux-x64-*.tar.gz' \
            --clobber || true
          cd ..
          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          TAG="$TAG" REPO="$GITHUB_REPOSITORY" RELEASE_JSON="$RELEASE_JSON" python3 - <<'EOF'
          import hashlib, json, os, sys
          from pathlib import Path

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          rel = json.loads(os.environ["RELEASE_JSON"])

          # version 去掉 v 前缀, 与 package.json 语义版本一致
          # (产物文件名 TSP-Setup-x64-0.3.3.exe 用的就是不带 v 的版本)
          version = tag[1:] if tag.startswith("v") else tag

          # 资产文件名 → 渠道名 (客户端按渠道取下载地址); 文件名带版本号, 按当前 tag 拼
          channels_cfg = {
              f"TSP-Setup-x64-{version}.exe": "windows",
              f"TSP-macos-arm64-{version}.dmg": "macos-arm64",
              f"TSP-linux-x64-{version}.tar.gz": "linux-x64",
          }
          by_name = {a["name"]: a for a in rel.get("assets", [])}

          channels = {}
          for name, channel in channels_cfg.items():
              local = Path("assets") / name
              if not local.exists():
                  continue  # 本次未构建该平台 (分批发布), 清单只列实际存在的
              sha = hashlib.sha256(local.read_bytes()).hexdigest()
              channels[channel] = {
                  "name": name,
                  "url": by_name[name]["browser_download_url"],
                  "size": by_name[name]["size"],
                  "sha256": sha,
              }

          if not channels:
              print("::warning::Release 上没有任何安装包资产, 跳过 latest.json 生成")
              sys.exit(0)

          manifest = {
              "version": version,
              "tag": tag,
              "released_at": rel.get("published_at") or rel.get("created_at"),
              "prerelease": bool(rel.get("prerelease")),
              "notes_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "channels": channels,
          }
          Path("latest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          EOF
          # --clobber: 同名资产覆盖 (重跑同一版本时更新清单而不是追加 _01 副本)
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
