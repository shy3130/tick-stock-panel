# Phase 0 单 service:FastAPI 启动后既跑 API 又托管前端 dist。
# 见 ADR-17 / §8.1。
services:
  app:
    # 通过 TICKFLOW_IMAGE 固定每次部署的镜像标签，便于保留上一版本并快速回滚。
    image: ${TICKFLOW_IMAGE:-tickflow-stock-panel-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE_PREFIX: ${BASE_IMAGE_PREFIX:-}
        BACKEND_EXTRAS: ${BACKEND_EXTRAS:-}
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.144.3}
    container_name: TickFlow_Stock_Panel
    ports:
      - "${PORT:-3018}:3018"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # 强制固定为容器内绝对路径, 防止 .env 里的 DATA_DIR=./data(开发模式用)
      # 被 env_file 原样传入容器后按错误的相对路径解析, 写到未挂载卷的目录,
      # 导致每次 up --build 重建容器都丢数据。environment 优先级高于 env_file,
      # 无论 .env 怎么写这里都以容器路径为准。
      - DATA_DIR=/app/data
      # 将主机 Codex Desktop 的 loopback local-access 端点映射到 Docker host gateway。
      - CODEX_DOCKER_HOST=host.docker.internal
      # ClickHouse 默认运行在 Docker 主机；三类 Provider 可在设置页分别选择。
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://host.docker.internal:8123}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-longbridge}
      - CLICKHOUSE_READ_TIMEOUT_SECONDS=${CLICKHOUSE_READ_TIMEOUT_SECONDS:-30}
      # ClickHouse 尚未覆盖的单股分时由 Longbridge API 按需补拉；结果会回写实时行情库。
      - LONGBRIDGE_API_URL=${LONGBRIDGE_API_URL:-http://host.docker.internal:19912}
      - LONGBRIDGE_API_TIMEOUT_SECONDS=${LONGBRIDGE_API_TIMEOUT_SECONDS:-20}
    volumes:
      - ./data:/app/data
      - ./tiers.yaml:/app/tiers.yaml:ro
      # 复用主机 Codex 登录态；后端只读后复制到单次请求的临时 CODEX_HOME。
      # Windows PowerShell/CMD 下 HOME 常未设置, 可通过 .env 里 CODEX_HOME_HOST 覆盖。
      - ${CODEX_HOME_HOST:-${HOME}/.codex}:/root/.codex:ro
    restart: unless-stopped
