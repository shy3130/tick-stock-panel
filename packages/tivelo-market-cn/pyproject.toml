[project]
name = "tivelo-market-cn"
version = "0.1.0a1"
description = "Versioned A-share market rules and legacy TSP compatibility"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0 AND MIT"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE"]
dependencies = [
    "tivelo-contracts>=0.1.0a1,<0.2",
    "numpy>=1.24,<3",
    "polars>=1.44,<1.45",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
tivelo-market-cn = "tivelo_market_cn.profile_presets:main"

[project.entry-points."tivelo.market_rules.v1"]
"tivelo.market.cn.cash-equity" = "tivelo_market_cn.adapter:create_rules"
"tivelo.market.cn.legacy-minute" = "tivelo_market_cn.legacy.price_limits:create_legacy_minute_limits"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tivelo_market_cn"]

[tool.uv.sources]
tivelo-contracts = { path = "../tivelo-contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
