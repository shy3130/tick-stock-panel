<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <title>Quant Research Workbench</title>
    <!-- Apply stored theme before paint to avoid flash. Key: tickflow-theme -->
    <script>
      (function () {
        try {
          var key = 'tickflow-theme';
          var stored = localStorage.getItem(key);
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var root = document.documentElement;
          if (theme === 'light') root.classList.remove('dark');
          else root.classList.add('dark');
          root.dataset.theme = theme;
          var meta = document.querySelectorAll('meta[name="theme-color"]');
          // Prefer matching media; fallback first meta
          var color = theme === 'light' ? '#f5f7fa' : '#0f1419';
          meta.forEach(function (m) {
            var media = m.getAttribute('media') || '';
            if (!media || media.indexOf(theme) !== -1) m.setAttribute('content', color);
          });
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="bg-base text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
